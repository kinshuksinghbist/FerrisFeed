# FerrisFeed Gradle properties
# AndroidX + Jetpack
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
android.enableOnBackInvokedCallback=true
android.defaults.buildfeatures.buildconfig=true
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false

# Kotlin
kotlin.code.style=official
kotlin.incremental=true
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx3g -Dfile.encoding=UTF-8

# KSP
ksp.incremental=true

# Gradle performance
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# R8 / shrinking — enabled for release, see app/build.gradle.kts
android.enableR8.fullMode=true

# Room
room.incremental=true
room.generateKotlin=true

# Hilt
hilt.enableAggregatingTask=true
