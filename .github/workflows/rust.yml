name: rust

on:
  push:
    paths:
      - "rust-core/**"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "rust-core/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Test
        run: cargo test --manifest-path rust-core/Cargo.toml --all-targets
      - name: Clippy
        run: cargo clippy --manifest-path rust-core/Cargo.toml --all-targets -- -D warnings
      - name: Format
        run: cargo fmt --manifest-path rust-core/Cargo.toml -- --check
